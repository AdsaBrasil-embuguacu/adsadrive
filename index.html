<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Portal ADSA | Gestão Documental</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #3b82f6;
      --bg-dark: #0f172a;
      --glass: rgba(30, 41, 59, 0.7);
      --border: rgba(148, 163, 184, 0.1);
    }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: #e2e8f0; overflow: hidden; }
    
    /* Glassmorphism Classes */
    .glass-panel {
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    
    .hover-glass:hover {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.4);
      transform: translateY(-2px);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    /* Animations */
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .grid-files { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
    
    /* Loading Spinner */
    .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--primary); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-[url('https://wallpaperaccess.com/full/1567834.jpg')] bg-cover bg-center bg-no-repeat bg-fixed">
  
  <div class="absolute inset-0 bg-slate-900/90"></div>

  <div id="loginScreen" class="relative min-h-screen flex items-center justify-center p-4 z-10">
    <div class="glass-panel w-full max-w-md p-8 rounded-2xl fade-in">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30">
          <i class="fa-solid fa-folder-tree text-2xl text-white"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Portal ADSA Docs</h1>
        <p class="text-slate-400 text-sm mt-2">Acesso restrito à Secretaria</p>
      </div>

      <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">E-mail Corporativo</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-4 top-3.5 text-slate-500"></i>
            <input type="email" id="email" required class="w-full bg-slate-800/50 border border-slate-700 rounded-lg py-3 pl-10 pr-4 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-slate-600" placeholder="usuario@adsaembuguacu.com.br">
          </div>
        </div>
        
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Senha de Acesso</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-500"></i>
            <input type="password" id="senha" required class="w-full bg-slate-800/50 border border-slate-700 rounded-lg py-3 pl-10 pr-4 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-slate-600" placeholder="••••••••">
          </div>
          <div class="text-right mt-2">
            <a href="#" onclick="toggleForgot()" class="text-xs text-blue-400 hover:text-blue-300 transition-colors">Esqueci minha senha</a>
          </div>
        </div>

        <button type="submit" id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-lg shadow-blue-600/30 transition-all active:scale-95 flex justify-center items-center gap-2">
          <span>ACESSAR SISTEMA</span>
        </button>
      </form>

      <div id="forgotView" class="hidden space-y-4 mt-4 pt-4 border-t border-slate-700">
        <p class="text-sm text-slate-300 text-center">Informe seu e-mail para receber as instruções.</p>
        <div class="flex gap-2">
          <input type="email" id="recupEmail" class="w-full bg-slate-800/50 border border-slate-700 rounded-lg p-3 text-white text-sm" placeholder="Seu e-mail cadastrado">
          <button onclick="handleRecovery()" id="btnRecuperar" class="bg-slate-700 hover:bg-slate-600 text-white px-4 rounded-lg text-sm font-bold">Enviar</button>
        </div>
        <button onclick="toggleForgot()" class="w-full text-xs text-slate-500 hover:text-slate-300 mt-2">Voltar ao login</button>
      </div>
    </div>
  </div>

  <div id="dashboardScreen" class="relative hidden h-screen flex flex-col z-10">
    
    <header class="h-16 glass-panel border-x-0 border-t-0 flex items-center justify-between px-6 z-20">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center">
          <i class="fa-solid fa-cloud text-white text-sm"></i>
        </div>
        <span class="font-bold text-lg tracking-tight">ADSA<span class="text-blue-400">Drive</span></span>
      </div>

      <div class="flex-1 max-w-xl mx-6">
        <div class="relative group">
          <i class="fa-solid fa-search absolute left-3 top-2.5 text-slate-400 group-focus-within:text-blue-400 transition-colors"></i>
          <input type="text" id="searchInput" onkeyup="if(event.key === 'Enter') loadFolder(currentFolderId)" class="w-full bg-slate-800/50 border border-slate-700 rounded-full py-2 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-blue-500 focus:bg-slate-800 transition-all" placeholder="Pesquisar documentos...">
        </div>
      </div>

      <div class="flex items-center gap-4">
        <div class="text-right hidden md:block">
          <p id="userNameDisplay" class="text-sm font-bold text-white leading-tight">Usuário</p>
          <p id="userRoleDisplay" class="text-[10px] text-blue-400 font-bold uppercase tracking-wider">Permissão</p>
        </div>
        <button onclick="logout()" class="w-9 h-9 rounded-full bg-slate-800 hover:bg-red-900/50 text-slate-400 hover:text-red-400 flex items-center justify-center transition-all" title="Sair">
          <i class="fa-solid fa-power-off"></i>
        </button>
      </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
      <aside class="w-64 glass-panel border-y-0 border-l-0 hidden md:flex flex-col p-4">
        <nav class="space-y-1">
          <button onclick="loadFolder('root')" class="w-full flex items-center gap-3 px-3 py-2 text-slate-300 hover:bg-slate-800/50 hover:text-white rounded-lg transition-colors text-sm font-medium">
            <i class="fa-solid fa-house text-blue-500"></i> Início
          </button>
          <div class="pt-4 pb-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest px-3">Acesso Rápido</div>
          <div id="quickAccess" class="space-y-1">
            </div>
        </nav>
      </aside>

      <section class="flex-1 p-6 overflow-y-auto relative">
        
        <div class="flex justify-between items-center mb-6">
          <div class="flex items-center gap-2 text-sm text-slate-400" id="breadcrumb">
            <span class="text-white font-bold"><i class="fa-solid fa-folder-open mr-2"></i> Início</span>
          </div>
          <button onclick="loadFolder(currentFolderId)" class="p-2 text-slate-400 hover:text-white transition-colors">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
        </div>

        <div id="contentArea" class="grid-files pb-10">
          </div>

        <div id="contentLoader" class="absolute inset-0 bg-slate-900/80 flex items-center justify-center z-10 hidden">
          <div class="text-center">
            <div class="loader mx-auto mb-2"></div>
            <p class="text-xs text-slate-400 font-mono animate-pulse">CARREGANDO DADOS...</p>
          </div>
        </div>

      </section>
    </main>
  </div>

  <script>
    // --- URL DA API (GOOGLE APPS SCRIPT) ---
    const API_URL = "https://script.google.com/macros/s/AKfycbzlAFUQeLTCHt4wr_uXnYW37hLQ8cu_KMfLYmnyCDMewW2IkKjnHTAQj_6rsy2bRKPP/exec";

    // --- ESTADO GLOBAL ---
    let currentUser = null;
    let currentFolderId = 'root';
    
    // --- FUNÇÃO GENÉRICA DE REQUISIÇÃO ---
    async function requestAPI(action, payload = {}) {
      // Adiciona a ação ao payload
      const body = JSON.stringify({ action, ...payload });
      
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: body
          // Nota: O modo 'no-cors' não é usado aqui pois precisamos ler a resposta JSON.
          // O Apps Script redireciona a resposta, e o fetch segue automaticamente.
        });
        
        if (!response.ok) throw new Error('Erro na rede ou servidor');
        return await response.json();
      } catch (error) {
        console.error("Erro na API:", error);
        throw error;
      }
    }

    // --- FUNÇÕES DE LOGIN ---
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const originalText = btn.innerHTML;
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      
      setBtnLoading(btn, true);

      try {
        const res = await requestAPI('login', { email, senha });
        
        if (res.status === 'success') {
          currentUser = res.user;
          sessionStorage.setItem('adsaUser', JSON.stringify(currentUser));
          initDashboard();
        } else {
          alert(res.message);
        }
      } catch (err) {
        alert('Erro ao conectar ao servidor. Verifique sua conexão.');
      } finally {
        setBtnLoading(btn, false, originalText);
      }
    }

    function toggleForgot() {
      document.getElementById('formLogin').classList.toggle('hidden');
      document.getElementById('forgotView').classList.toggle('hidden');
    }

    async function handleRecovery() {
      const email = document.getElementById('recupEmail').value;
      const btn = document.getElementById('btnRecuperar');
      if(!email) return alert('Digite o e-mail');
      
      const originalText = btn.innerHTML;
      btn.innerText = '...';
      btn.disabled = true;

      try {
        const res = await requestAPI('enviarEmailRecuperacao', { email });
        alert(res.message);
        toggleForgot();
      } catch (err) {
        alert("Erro ao solicitar recuperação.");
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    function logout() {
      sessionStorage.removeItem('adsaUser');
      location.reload();
    }

    function setBtnLoading(btn, isLoading, originalHtml = '') {
      if (isLoading) {
        btn.disabled = true;
        btn.innerHTML = '<div class="loader" style="width:18px;height:18px;"></div> Acessando...';
        btn.classList.add('opacity-75', 'cursor-not-allowed');
      } else {
        btn.disabled = false;
        btn.innerHTML = originalHtml;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
      }
    }

    // --- DASHBOARD LOGIC ---
    
    function initDashboard() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('dashboardScreen').classList.remove('hidden');
      document.getElementById('userNameDisplay').textContent = currentUser.email.split('@')[0];
      document.getElementById('userRoleDisplay').textContent = currentUser.role;

      loadFolder('root');
    }

    async function loadFolder(folderId) {
      currentFolderId = folderId;
      const loader = document.getElementById('contentLoader');
      const content = document.getElementById('contentArea');
      const search = document.getElementById('searchInput').value;

      loader.classList.remove('hidden');
      content.innerHTML = '';

      try {
        const res = await requestAPI('getContents', {
          folderId: folderId,
          userRole: currentUser.role,
          allowedFolders: currentUser.allowedFolders,
          searchQuery: search
        });
        
        renderContents(res);
      } catch (err) {
        content.innerHTML = `<div class="col-span-full text-center text-red-400 p-4">Erro ao carregar pasta: ${err}</div>`;
      } finally {
        loader.classList.add('hidden');
      }
    }

    function renderContents(data) {
      const content = document.getElementById('contentArea');

      if (data.error) {
        content.innerHTML = `<div class="col-span-full text-center text-red-400">Erro no servidor: ${data.error}</div>`;
        return;
      }

      // Breadcrumb Update
      if(data.path) {
        const breadHtml = data.path.map((p, idx) => {
          if (idx === data.path.length - 1) return `<span class="text-white font-bold">${p.name}</span>`;
          return `<button onclick="loadFolder('${p.id}')" class="hover:text-blue-400 hover:underline">${p.name}</button> <span class="mx-1">/</span>`;
        }).join('');
        document.getElementById('breadcrumb').innerHTML = breadHtml;
      }

      // Render Folders
      let html = '';
      
      if (data.folders.length === 0 && data.files.length === 0) {
        html = `<div class="col-span-full text-center text-slate-500 py-10 flex flex-col items-center">
                  <i class="fa-regular fa-folder-open text-4xl mb-2 opacity-50"></i>
                  <p>Pasta vazia ou sem permissão.</p>
                </div>`;
      }

      // Folders
      data.folders.forEach(f => {
        html += `
          <div onclick="loadFolder('${f.id}')" class="glass-panel p-4 rounded-xl cursor-pointer hover-glass flex flex-col items-center justify-center text-center gap-3 h-32 transition-all group">
            <i class="fa-solid fa-folder text-4xl text-blue-500 group-hover:text-blue-400 transition-colors drop-shadow-lg"></i>
            <span class="text-xs font-semibold text-slate-300 group-hover:text-white line-clamp-2 leading-tight">${f.name}</span>
          </div>
        `;
      });

      // Files
      data.files.forEach(f => {
        let colorClass = 'text-slate-400';
        if (f.icon.includes('excel')) colorClass = 'text-emerald-500';
        if (f.icon.includes('word')) colorClass = 'text-blue-500';
        if (f.icon.includes('pdf')) colorClass = 'text-red-500';
        if (f.icon.includes('image')) colorClass = 'text-purple-500';

        html += `
          <a href="${f.url}" target="_blank" class="glass-panel p-4 rounded-xl cursor-pointer hover-glass flex flex-col items-center justify-center text-center gap-3 h-32 transition-all group no-underline">
            <i class="fa-solid ${f.icon} text-3xl ${colorClass} group-hover:scale-110 transition-transform"></i>
            <span class="text-xs font-medium text-slate-300 group-hover:text-white line-clamp-2 break-all w-full leading-tight" title="${f.name}">${f.name}</span>
          </a>
        `;
      });

      content.innerHTML = html;
    }

    // Auto-login check
    window.onload = () => {
      const savedUser = sessionStorage.getItem('adsaUser');
      if(savedUser) {
        currentUser = JSON.parse(savedUser);
        initDashboard();
      }
    }
  </script>
</body>
</html>
